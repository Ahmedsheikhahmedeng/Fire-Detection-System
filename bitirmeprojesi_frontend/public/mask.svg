<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Core central blocks -->
  <rect x="400" y="400" width="200" height="200" fill="black"/>
  <!-- Inner ring of blocks -->
  <rect x="350" y="450" width="50" height="100" fill="black"/>
  <rect x="600" y="450" width="50" height="100" fill="black"/>
  <rect x="450" y="350" width="100" height="50" fill="black"/>
  <rect x="450" y="600" width="100" height="50" fill="black"/>
  <!-- Middle tactical ring -->
  <rect x="300" y="400" width="50" height="200" fill="black"/>
  <rect x="650" y="400" width="50" height="200" fill="black"/>
  <rect x="400" y="300" width="200" height="50" fill="black"/>
  <rect x="400" y="650" width="200" height="50" fill="black"/>
  <!-- Outer tactical corners -->
  <rect x="250" y="250" width="100" height="100" fill="black"/>
  <rect x="650" y="250" width="100" height="100" fill="black"/>
  <rect x="250" y="650" width="100" height="100" fill="black"/>
  <rect x="650" y="650" width="100" height="100" fill="black"/>
  <!-- Small detail blocks -->
  <rect x="500" y="200" width="50" height="50" fill="black"/>
  <rect x="500" y="750" width="50" height="50" fill="black"/>
  <rect x="200" y="500" width="50" height="50" fill="black"/>
  <rect x="750" y="500" width="50" height="50" fill="black"/>
</svg>

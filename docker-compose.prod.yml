services:
  db:
    image: postgres:15
    container_name: fire_db
    restart: unless-stopped
    env_file:
      - ./.env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./fire-detection-backend
    container_name: fire_backend
    restart: unless-stopped
    env_file:
      - ./fire-detection-backend/.env.production
    environment:
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./bitirmeprojesi_frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
    container_name: fire_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
